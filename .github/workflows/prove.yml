# Le prove su ogni pull request e su main: niente dipendenze, sintassi, npm test (con Stripe, GitHub, posta e blockchain finti:
# niente rete, niente chiavi) e la scansione dei segreti con gitleaks su tutta la storia.
name: Prove

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Nessuna dipendenza
        run: |
          node -e '
            const p = require("./package.json");
            const k = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "bundleDependencies"].filter(k => p[k] && Object.keys(p[k]).length);
            if (k.length) { console.error(`package.json: ${k.join(", ")} non vuoto. Repobay non ha dipendenze (CONTRIBUTING.md)`); process.exit(1); }'
          if [ -e package-lock.json ] || [ -d node_modules ]; then echo "package-lock.json o node_modules: Repobay non ha dipendenze"; exit 1; fi
      - name: Sintassi
        run: for f in server/*.js server/rotte/*.js strumenti/*.mjs test/*.mjs web/*.js; do node --check "$f"; done
      - name: npm test
        run: npm test

  segreti:
    name: Segreti (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSIONE: 8.30.1
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, con il controllo dell'impronta
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLf -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSIONE}/gitleaks_${VERSIONE}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Tutta la storia e i file
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
